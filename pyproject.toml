[project]
name = "doosri-awaaz"
version = "0.1.0"
description = "Offline, home-language guided practice for the unattended grade in multigrade classrooms"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
device = ["vosk>=0.3.45", "sounddevice>=0.4", "numpy"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
